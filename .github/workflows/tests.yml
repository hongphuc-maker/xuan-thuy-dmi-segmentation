name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install -e ".[train,evaluate,report,test]"
      - name: Run tests
        run: pytest
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
