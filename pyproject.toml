[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuan-thuy-dmi-segmentation"
version = "0.1.0"
description = "Reproducible Sentinel-2 semantic segmentation with DMI loss and learnable morphology"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Xuan Thuy Segmentation Research Team"},
]
keywords = [
  "semantic-segmentation",
  "sentinel-2",
  "label-noise",
  "dmi-loss",
  "mathematical-morphology",
  "remote-sensing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.4,<3",
  "pandas>=2.1,<3",
  "rasterio>=1.4,<2",
  "scipy>=1.11,<2",
  "tqdm>=4.66,<5",
]
evaluate = [
  "geopandas==1.0.1",
  "pyogrio==0.10.0",
]
report = [
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "rasterio>=1.4,<2",
  "scipy>=1.11,<2",
]
test = [
  "pytest>=8,<10",
  "scipy>=1.11,<2",
]

[project.scripts]
xtseg = "xuanthuy_seg.cli:main"

[project.urls]
Homepage = "https://github.com/hongphuc-maker/xuan-thuy-dmi-segmentation"
Repository = "https://github.com/hongphuc-maker/xuan-thuy-dmi-segmentation"
Issues = "https://github.com/hongphuc-maker/xuan-thuy-dmi-segmentation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
